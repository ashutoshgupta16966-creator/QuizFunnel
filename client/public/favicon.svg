<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="qf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4361EE"/>
      <stop offset="50%" stop-color="#7209B7"/>
      <stop offset="100%" stop-color="#F72585"/>
    </linearGradient>
    <linearGradient id="qf-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CC9F0"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Rounded App Tile -->
  <rect width="512" height="512" rx="112" fill="url(#qf-bg)"/>
  <!-- Dark subtle inner overlay for depth -->
  <rect width="472" height="472" x="20" y="20" rx="96" fill="#0D1B2A" fill-opacity="0.25"/>
  <!-- Graduation Cap / Diamond Emblem -->
  <g filter="url(#glow)" transform="translate(256, 230)">
    <!-- Mortarboard Top -->
    <polygon points="0,-100 160,-20 0,60 -160,-20" fill="url(#qf-accent)"/>
    <!-- Mortarboard Skullcap -->
    <path d="M -90,0 L -90,60 C -90,110 90,110 90,60 L 90,0 Z" fill="#ffffff" fill-opacity="0.95"/>
    <!-- Tassel String & Tassel -->
    <path d="M 0,-20 Q 120,-10 140,50" stroke="#FFD700" stroke-width="8" fill="none" stroke-linecap="round"/>
    <circle cx="140" cy="55" r="10" fill="#FFD700"/>
    <!-- Spark / Lightning Bolt inside -->
    <polygon points="10,-60 -25,-20 0,-15 -15,25 25,-15 5,-20" fill="#0D1B2A"/>
  </g>
  <!-- Funnel Arc lines at bottom -->
  <path d="M 176,380 L 336,380" stroke="#4CC9F0" stroke-width="16" stroke-linecap="round"/>
  <path d="M 216,420 L 296,420" stroke="#FFD700" stroke-width="14" stroke-linecap="round"/>
  <circle cx="256" cy="455" r="8" fill="#F72585"/>
</svg>
